[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include stealthburner_leds.cfg]
[include macros.cfg]
[include Zerog_Purge.cfg]

#####################################################################
# 	General Setup
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300 #600
max_accel: 3000 #5000
max_z_velocity: 5
max_z_accel: 50

# Enable object exclusion
[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[respond]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu]
canbus_uuid: eda556af8838
#canbus_interface: can0

[mcu EBBCan]
canbus_uuid: 7beb2bc5841d
#canbus_interface: can0

[mcu scanner]
serial: /dev/serial/by-id/usb-Cartographer_614e_2E001F000E43304146393320-if00

#[mcu eddy]
#canbus_uuid: df0e5308fc76

#[firmware_retraction]
#retract_length: 40
#retract_speed: 40
#unretract_extra_length: 10 # Increase if not primed enough when starting, decrease if over primed
#unretract_speed: 25

#####################################################################
# 	X & Y Steppers
#####################################################################

# X Stepper on Motor1(B Motor)
[stepper_x]
step_pin: PE2
dir_pin: !PB4
enable_pin: !PC11
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ~EBBCan: gpio24
position_min: -16
position_endstop: 267.5
position_max: 267.5
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC10
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# Y Stepper on Motor2 (A Motor)
[stepper_y]
step_pin: PF12
dir_pin: !PF11
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PF4
position_min: -5
position_endstop: 240
position_max: 240
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PF13
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Z Steppers
#####################################################################

# Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: PD7
dir_pin: !PD6
enable_pin: !PF10
rotation_distance: 2    
microsteps: 128
endstop_pin: probe:z_virtual_endstop
position_max: 265
position_min: -5
homing_speed: 8.0
second_homing_speed: 3
homing_retract_dist: 0 #3

[tmc2209 stepper_z]
uart_pin: PF9
run_current: 0.580
stealthchop_threshold: 999999

#	Z1 Stepper - Rear  on Motor5
[stepper_z1]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PD5
rotation_distance: 2  
microsteps: 128

[tmc2209 stepper_z1]
uart_pin: PD4
interpolate: true
run_current: 0.580
stealthchop_threshold: 999999

#	Z2 Stepper - Front Right on Motor6
[stepper_z2]
step_pin: PC9
dir_pin: !PC8
enable_pin: !PD1
rotation_distance: 2 
microsteps: 128

[tmc2209 stepper_z2]
uart_pin: PD0
interpolate: true
run_current: 0.580
stealthchop_threshold: 999999

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: EBBCan: gpio18
dir_pin: EBBCan: gpio19
enable_pin: !EBBCan: gpio17
microsteps: 16
rotation_distance: 46.565
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: gpio7
sensor_type: Generic 3950 #MAX31865
sensor_pin: EBBCan: gpio27
#spi_software_sclk_pin: EBBCan: gpio10
#spi_software_mosi_pin: EBBCan: gpio8
#spi_software_miso_pin: EBBCan: gpio11
#rtd_nominal_r: 1000
#rtd_reference_r: 4300
#rtd_num_of_wires: 2
min_temp: 1
max_temp: 300
max_power: 1.0
min_extrude_temp: 1
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: EBBCan: gpio20
interpolate: false
run_current: 0.6
stealthchop_threshold: 0

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PB5 
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA0
min_temp: 0
max_temp: 130

#####################################################################
# 	Probe,  Bed Mesh, & Homing
#####################################################################

[scanner]
mcu: scanner            
#   Offsets are measured from the centre of your coil, to the tip of your nozzle 
#   on a level axis. It is vital that this is accurate. 
x_offset: 0                          
#    adjust for your cartographers offset from nozzle to middle of coil
y_offset: 2.1                        
#    adjust for your cartographers offset from nozzle to middle of coil
backlash_comp: 0.00188
#   Backlash compensation distance for removing Z backlash before measuring
#   the sensor response.
sensor: cartographer
#    this must be set as cartographer unless using IDM etc.
sensor_alt: carto
#    alternate name to call commands. CARTO_TOUCH etc      
mesh_runs: 2
#    Number of passes to make during mesh scan.

